# Override applied on top of the official self-hosted Supabase compose (supabase/supabase, docker/).
# scripts/deploy.sh supabase copies it next to docker-compose.yml and sets
# COMPOSE_FILE=docker-compose.yml:docker-compose.fabrics.yml in that folder's .env.
#
# What it changes for FabriCS:
#   - the API gateway joins the network shared with the FabriCS stack (alias supabase-api),
#     so the microservices and Caddy reach it at http://supabase-api:8000;
#   - the gateway and PostgreSQL are published on 127.0.0.1 only (SSH tunnel for admin work);
#   - services FabriCS does not use (Realtime, Edge Functions, Supavisor pooler) are disabled.
# Needs Docker Compose 2.24+ (!override).

services:
  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000"
    networks:
      default: {}
      fabrics:
        aliases: [supabase-api]

  db:
    ports:
      - "127.0.0.1:5432:5432"

  realtime:
    profiles: [disabled]

  functions:
    profiles: [disabled]

  supavisor:
    profiles: [disabled]

networks:
  fabrics:
    name: ${FABRICS_NETWORK:-fabrics_net}
    external: true
